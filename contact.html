<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nostra - Contact Us</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#f5f5f0] min-h-screen">

    <!-- navbar -->
    <nav class="flex items-center justify-between px-8 py-4 bg-white sticky top-0 z-10 shadow-md">

        <div>
            <h1 class="font-bold text-3xl">Nostra</h1>
        </div>
        <div class="flex  gap-16 mr-20">
            <a href="index.html" class="no-underline hover:underline">Home</a>
            <a href="newarraivals.html" class="no-underline hover:underline">New Arrival</a>
            <a href="mostwanted.html" class="no-underline hover:underline">Most Wanted</a>
            <a href="collections.html" class="no-underline hover:underline">Collections</a>
            <a href="contact.html" class="no-underline hover:underline">Contact Us</a>
        </div>
    </nav>

    <!-- Main Content -->

    <section>
        <div class="flex justify-center items-start px-8 py-10">

            <!-- Contact Card -->
            <div class="bg-[#12181f] rounded-xl w-full max-w-5xl px-16 py-14">

                <h2 class="text-white text-xl font-semibold mb-6">Contact Us</h2>

                <div class="flex flex-col gap-5">

                    <!-- Name -->
                    <div>
                        <label class="text-white text-sm mb-2 ">Name:</label>
                        <input type="text"
                            class="w-full bg-white rounded-md px-4 py-8 mt-2 text-md text-gray-800 outline-none" />
                    </div>

                    <!-- Email -->
                    <div>
                        <label class="text-white text-sm mb-2 block">Email:</label>
                        <input type="email"
                            class="w-full bg-white rounded-md px-4 py-8 text-md text-gray-800 outline-none" />
                    </div>

                    <!-- Message -->
                    <div>
                        <label class="text-white text-sm mb-2 block">Message:</label>
                        <textarea rows="5"
                            class="w-full bg-white rounded-md px-4 py-4 text-md text-gray-800 outline-none resize-y"></textarea>
                    </div>

                    <!-- Submit Button -->
                    <div>
                        <button
                            class="bg-blue-600 hover:bg-blue-700 text-white text-md px-5 py-2 rounded-md transition-colors">
                            Submit
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </section>




    <!-- Join our News Letter -->


    <section class="mt-5 p-5 ">


        <div class="flex justify-center ">
            <div>
                <h2 class=" font-bold text-5xl">Join our News Letter</h2>
            </div>
        </div>

        <p class="text-2xl mt-3 text-center">Signup for our email newspaper to get exclusive discounts, updates, and
            more</p>

        <div class="border-2 border-[#1D232C] w-[65%] h-10 mx-auto mt-5 "></div>



        <button class="flex mt-3 gap-3 bg-[#1D232C] text-white px-6 py-3 rounded-lg hover:bg-[#3A4A5D] mx-auto">Subcribe
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3"
                stroke="currentColor" class="w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 8.25 21 12m0 0-3.75 3.75M21 12H3" />
            </svg>
        </button>

    </section>


    <!-- footer -->

    <footer>

        <div class="bg-[#1D232C] p-10">
            <h2 class="text-3xl font-bold text-white">Nostra</h2>
            <p class="text-2xl text-white mt-4">The Standard chunk of Lorem ipsum used since the 1500s is reprodused
                below for those interest</p>

            <div class="flex  gap-10 mt-5 ml-1 text-4xl">
                <div>
                    <i class="fa-brands fa-instagram hover:animate-bounce text-" 3xl"></i>
                </div>

                <div>
                    <i class="fa-brands fa-twitter hover:animate-bounce text-3xl"></i>
                </div>

                <div>
                    <i class="fa-brands fa-facebook hover:animate-bounce text-3xl"></i </div>
                </div>


            </div>
            <p class="text-white mt-5 text-2xl">@ 2023 Nostra.com</p>
    </footer>


</body>

</html>
