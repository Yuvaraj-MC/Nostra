    <!-- Most Wanted -->

    <section class="mt-10 p-5">

        <h2 class="font-bold text-3xl mb-8">
            Most Wanted
        </h2>

        <!-- Cards Container -->
        <div class="flex items-center justify-between gap-6 flex-wrap">

            <!-- Card 1 -->
            <div class="relative bg-gray-100 rounded-lg p-4">

                <!-- Sale Tag -->
                <div class="absolute top-0 left-0 bg-[#FF0000] text-white 
                        text-3xl px-4 py-1 rounded-lg">

                    sale

                </div>

                <!-- Image -->
                <img src="./images/blackhalfshirt.jpg" alt="blackshirt"
                    class="w-[320px] h-[320px] object-cover rounded-lg">

                <!-- Heart Icon -->
                <div class="absolute bottom-5 right-5">

                    <svg onclick="toggleHeart(this)" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke-width="1.8" stroke="currentColor"
                        class="w-14 h-14 cursor-pointer hover:scale-110 transition duration-300">

                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />

                    </svg>

                </div>

            </div>




            <!-- Card 2 -->
            <div class="relative bg-gray-100 rounded-lg p-4">

                <div class="absolute top-0 left-0 bg-[#FF0000] text-white 
                        text-3xl px-4 py-1 rounded-lg">

                    sale

                </div>

                <img src="./images/yellowshirt.jpg" alt="yellowshirt"
                    class="w-[320px] h-[320px] object-cover rounded-lg">

                <div class="absolute bottom-5 right-5">

                    <svg onclick="toggleHeart(this)" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke-width="1.8" stroke="currentColor"
                        class="w-14 h-14 cursor-pointer hover:scale-110 transition duration-300">

                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />

                    </svg>

                </div>

            </div>



            <!-- Card 3 -->
            <div class="relative bg-gray-100 rounded-lg p-4">

                <div class="absolute top-0 left-0 bg-[#FF0000] text-white 
                        text-3xl px-4 py-1 rounded-lg">

                    sale

                </div>

                <img src="./images/lightblueshirt.jpg" alt="lightblue"
                    class="w-[320px] h-[320px] object-cover rounded-lg">

                <div class="absolute bottom-5 right-5">

                    <svg onclick="toggleHeart(this)" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke-width="1.8" stroke="currentColor"
                        class="w-14 h-14 cursor-pointer hover:scale-110 transition duration-300">

                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />

                    </svg>

                </div>

            </div>



            <!-- Card 4 -->
            <div class="relative bg-gray-100 rounded-lg p-4">

                <div class="absolute top-0 left-0 bg-[#FF0000] text-white 
                        text-3xl px-4 py-1 rounded-lg">

                    sale

                </div>

                <img src="./images/goayellowshirt.jpg" alt="goashirt"
                    class="w-[320px] h-[320px] object-cover rounded-lg">

                <div class="absolute bottom-5 right-5">

                    <svg onclick="toggleHeart(this)" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke-width="1.8" stroke="currentColor"
                        class="w-14 h-14 cursor-pointer hover:scale-110 transition duration-300">

                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />

                    </svg>

                </div>

            </div>

        </div>


        <script>

            function toggleHeart(icon) {

                if (icon.classList.contains("text-red-500")) {

                    icon.classList.remove("text-red-500")
                    icon.setAttribute("fill", "none")

                } else {

                    icon.classList.add("text-red-500")
                    icon.setAttribute("fill", "currentColor")

                }

            }

        </script>

    </section>




</body>
